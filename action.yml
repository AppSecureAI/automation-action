name: AppSecAI Vulnerability Analysis
description:
  Automated security vulnerability triage, remediation, and validation powered
  by AI
author: AppSecAI

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: shield
  color: blue

# Define your inputs here.
inputs:
  api-url:
    description:
      AppSecAI API base URL. Leave unset unless AppSecAI Support provides a
      custom endpoint.
    required: false
    default: 'https://gh.cloud.appsecai.io'

  file:
    description:
      One SARIF, JSON, CSV, TSV, or XML file containing security scan results.
      Use either file or files, not both.
    required: false

  files:
    description:
      Comma- or newline-separated SARIF, JSON, CSV, TSV, or XML files to submit
      as one multi-SAST run. Supports simple * and ** glob patterns.
    required: false
    default: ''

  processing-mode:
    description:
      Product processing mode. Supported values are individual, individual_cc,
      and group_cc.
    required: false
    default: individual_cc

  update-context:
    description: Trigger fresh security context extraction before the scan
    required: false
    default: 'false'

  allow-missing-repo-access:
    description:
      Start the run even when the AppSecAI GitHub App cannot yet push to the
      target repository. Use this when the organization is licensed and the App
      is installed, but the specific repository simply has not been added to the
      App installation yet — the run starts now and remediation pull requests
      are delivered once the repository is granted to the App. When left at the
      default, the action fails fast with an actionable message if the App lacks
      push access.
    required: false
    default: 'false'

  allow-long-run-handoff:
    description:
      Exit successfully when the run is still active after the monitoring
      window. Keep false for CI gates that must wait for completed analysis.
    required: false
    default: 'false'

  pr-audience:
    description:
      Comma-separated ordered PR reviewer audiences to emphasize in generated
      remediation PR content, for example security,engineering
    required: false
    default: ''

# Define your outputs here.
outputs:
  message:
    description: Processed message
  run-id:
    description: AppSecAI run ID created by this action, when available
  run-status:
    description: Final observed AppSecAI run status or not_created
  run-complete:
    description:
      Whether the AppSecAI run reached a completed terminal state during this
      action
  dashboard-url:
    description: AppSecAI dashboard URL for the run, when available
  context-updated:
    description: Whether context was updated (true/false/rate-limited)

runs:
  using: node24
  main: dist/index.js
  post: dist/cleanup.js
  post-if: cancelled()
